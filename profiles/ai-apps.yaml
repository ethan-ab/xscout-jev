    OpenAI: official account of OpenAI
    OpenAIDevs: official OpenAI developer account
    sama: CEO of OpenAI
    AnthropicAI: official account of Anthropic
    claudeai: official Claude account
    ClaudeDevs: official Claude developer account
    GoogleDeepMind: official Google DeepMind account
    GoogleAI: official Google AI account
    sundarpichai: CEO of Google
    AIatMeta: official Meta AI account
    natfriedman: head of product at Meta Superintelligence Labs
    stripe: official account of Stripe
    patrickc: CEO of Stripe
    jeff_weinstein: product lead at Stripe
    Shopify: official account of Shopify
    tobi: CEO of Shopify
    vercel: official account of Vercel
    rauchg: CEO of Vercel
    Cloudflare: official account of Cloudflare
    xai: official account of xAI
    bot: official account of xAI's Grok Bot
    NousResearch: official account of Nous Research (Hermes Agent)
    openclaw: official OpenClaw account
    OfficialLoganK: product lead for Google AI Studio and the Gemini API
    Muse: official account of Meta's Muse personal agent
    finkd: CEO of Meta
    alexandr_wang: chief AI officer of Meta
    hbarra: leads Muse at Meta Superintelligence Labs
    jrlevine: product lead for Muse and the Muse Connector Platform
    MetaforDevs: official Meta developer account
    noahrshinn: founder of Instinct, a personal agent app
    TownAI: official account of Town, a personal AI assistant
    OmarShahine: Microsoft CVP for Microsoft Scout and Autopilot agents
  amplifiers:
    testingcatalog: AI news account that spots unreleased product features
    btibor91: AI news account that tracks AI app changes
    TechCrunch: tech news outlet
    verge: tech news outlet
    theinformation: tech news outlet
    Techmeme: tech news aggregator
    rowancheung: AI news newsletter (The Rundown)
    kimmonismus: AI news account
    AndrewCurran_: AI news account
    altryne: AI news podcast host (ThursdAI)
  keywords:
    chatgpt_plugin: '"ChatGPT plugin" OR "plugin in ChatGPT" OR "plugin for ChatGPT"'
    directories: '"Claude directory" OR "connectors directory" OR "ChatGPT directory" OR "plugin directory"'
    mcp_apps: '"MCP App" OR "MCP Apps"'
    claude_connector: '"Claude connector" OR "connector for Claude" OR "available in Claude"'
    host_plugins: '"Codex plugin" OR "Cowork plugin" OR "Muse connector" OR "Muse Connector Platform"'
    remote_mcp: '"remote MCP" OR "official MCP" OR "our MCP server"'
    webmcp: WebMCP
    protocols: '"A2A" OR "A2UI" OR "AAIF" OR "Agent Plugins" OR "ID-JAG"'
    agentic_checkout: '"agentic checkout" OR "Instant Checkout" OR "checkout in ChatGPT" OR "AI Mode checkout"'
    agentic_commerce: '"agentic commerce" OR "Agentic Commerce Protocol" OR "Universal Commerce Protocol"'
    agent_payments: '"agent payments" OR "agentic payments" OR x402'
    personal_agent: '"personal agent" OR "personal agents" OR "personal AI agent" OR "personal AI assistant"'
    assistant_launches: '("personal agent" OR "AI assistant" OR "AI employee") (introducing OR launch OR launching OR raises OR "now available" OR "rolling out")'
    muse: '(Muse OR @Muse) (Meta OR agent OR connector OR connectors OR "Muse Spark")'
    instinct: 'Instinct (agent OR assistant OR app)'
    town: '"TownAI" OR "@TownAI" OR "Town.com" OR (Townie (AI OR agent OR email)) OR (Town ("AI assistant" OR "personal agent"))'
    assistants: '"Grok Bot" OR "ChatGPT Work" OR "Claude Cowork" OR "Microsoft Scout" OR "Microsoft Autopilot" OR OpenClaw OR "Hermes Agent"'
exclude:
  question: Is this post promoting a course, a paid community, a newsletter or a giveaway?
scoring:
  significance:
    question: How big is the update announced or reported in this post, for the AI agent and AI app ecosystem as a whole?
    focus: Judge the update itself, not how excited the post sounds.
    levels:
      - summary: minor
        signals:
          - one company lists its app, plugin or MCP server
          - a small feature
          - tips, opinions, personal usage
      - summary: notable
        signals:
          - a well-known company ships a meaningful agent feature or connector
          - a popular agent ships a big release
          - an adoption milestone of an important product
      - summary: major
        signals:
          - an AI platform (OpenAI, Anthropic, Google, Meta, Microsoft, xAI) or a major infrastructure player (Stripe, Shopify, Cloudflare, Vercel) changes how AI apps or agents are built, distributed, paid or monetized
          - a new app store, directory, SDK or platform policy
          - a big tech company or a top-funded startup launches or significantly expands a personal agent (new platform, connectors, desktop app, big funding round)
      - summary: industry-shifting
        signals:
          - a new open standard or protocol, or a new version of MCP
          - several major platforms adopt the same standard
          - a large acquisition that reshapes the ecosystem
  relevance:
    question: How credibly can Acme speak about this topic from its own product and expertise?
    levels:
      - summary: no standing
        signals:
          - unrelated to MCP, AI apps or agent distribution
      - summary: can comment
        signals:
          - general AI agent news
      - summary: informed voice
        signals:
          - affects how brands reach users in AI assistants
          - agentic commerce
          - personal agents (Muse, Instinct, Town, Grok Bot) becoming a new way users reach services
      - summary: expert voice
        signals:
          - MCP, MCP Apps, WebMCP, ChatGPT plugins, Claude connectors, app submission and review
          - a personal agent opening to third-party apps, connectors or MCP (e.g. Muse Connectors)
actions:
  - id: how_to
    label: how-to
    question: Could Acme publish a practical guide about this (how to build, publish or adapt an app or MCP server for it)?
  - id: explainer
    label: explainer
    question: Could Acme publish an explainer of this protocol, standard or platform change for builders?
  - id: hot_take
    label: hot take
    question: Could Acme publish a credible opinion on what this move means for distribution through AI assistants?
  - id: brand_showcase
    label: brand showcase
    question: Is this a known brand launching an app in an AI assistant that Acme could showcase as an example for other brands?
  - id: data_point
    label: data point
    question: Does this post contain a striking number Acme could quote in its newsletter or a client workshop?
draft:
  template: |-
    You write LinkedIn posts for {org}. {about}
    Only state facts found in the sources below, and cite each one with its URL.

    Update: {title}
    Suggested angles: {actions}
    Sources:
    {sources}

    Give me: the angle, a one-line hook, a 3–5 bullet outline, one line tying it to {org}'s work, then a draft under 180 words.
grouping:
  stopwords:
    - agent
    - agents
    - personal
    - assistant
budget:
  usd_per_day: 2
